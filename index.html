<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tchat simple</title>

<style>
body{
font-family: Arial;
background:#f0f0f0;
text-align:center;
}

#chat{
width:400px;
height:300px;
border:1px solid #ccc;
background:white;
overflow:auto;
margin:auto;
padding:10px;
}

input{
width:300px;
padding:5px;
}

button{
padding:5px 10px;
}
</style>

<script>
function chargerMessages(){
fetch("messages.txt")
.then(response => response.text())
.then(data => {
document.getElementById("chat").innerHTML = data.replace(/\n/g,"<br>");
});
}

setInterval(chargerMessages,1000);
</script>

</head>

<body onload="chargerMessages()">

<h2>Tchat ultra simple</h2>

<div id="chat"></div>

<form action="send.html" method="post">
<input type="text" name="message" placeholder="Votre message">
<button type="submit">Envoyer</button>
</form>

</body>
</html>
