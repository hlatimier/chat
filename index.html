<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Discord Clone</title>




input{
padding:12px;
border:none;
border-radius:8px;
background:#1e1f22;
color:white;
}

button{
padding:12px 18px;
border:none;
border-radius:8px;
background:#5865f2;
color:white;
cursor:pointer;
}

button:hover{
background:#4752c4;
}

</style>
</head>

<body>

<!-- SERVEURS -->

<div id="servers">

<div class="server">D</div>
<div class="server">+</div>

</div>

<!-- CANAUX -->

<div id="channels">

<h2>Mon Serveur</h2>

<div class="channel">
# général
</div>

<div class="channel">
# gaming
</div>

<div class="channel">
# images
</div>

</div>

<!-- PRINCIPAL -->

<div id="main">

<div id="topbar">
# général
</div>

<div id="chat"></div>

<div id="inputArea">

<input
type="text"
id="pseudo"
placeholder="Pseudo">

<input
type="text"
id="message"
placeholder="Envoyer un message">

<input
type="file"
id="image">

<button onclick="envoyer()">
Envoyer
</button>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
collection,
addDoc,
query,
orderBy,
onSnapshot,
deleteDoc,
doc

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {

getStorage,
ref,
uploadBytes,
getDownloadURL

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig = {

apiKey: "TON_API_KEY",

authDomain: "TON_PROJET.firebaseapp.com",

projectId: "TON_PROJET",

storageBucket: "TON_PROJET.appspot.com",

messagingSenderId: "123456789",

appId: "TON_APP_ID"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const storage = getStorage(app);

const chat =
document.getElementById("chat");

const pseudoInput =
document.getElementById("pseudo");

/* SAUVEGARDE PSEUDO */

const pseudoSauvegarde =
localStorage.getItem("pseudo");

if(pseudoSauvegarde){

pseudoInput.value =
pseudoSauvegarde;

}

pseudoInput.addEventListener("input",()=>{

localStorage.setItem(
"pseudo",
pseudoInput.value
);

});

/* ENVOYER MESSAGE */

window.envoyer = async function(){

const pseudo =
document.getElementById("pseudo").value;

const message =
document.getElementById("message").value;

const imageFile =
document.getElementById("image").files[0];

if(pseudo === ""){
return;
}

let imageUrl = "";

if(imageFile){

const imageRef = ref(
storage,
"images/" +
Date.now() +
imageFile.name
);

await uploadBytes(
imageRef,
imageFile
);

imageUrl =
await getDownloadURL(imageRef);

}

await addDoc(
collection(db,"messages"),
{

pseudo:pseudo,
message:message,
image:imageUrl,
date:Date.now()

}

);

document.getElementById("message").value = "";

document.getElementById("image").value = "";

}

/* SUPPRIMER MESSAGE */

window.supprimer =
async function(id){

await deleteDoc(
doc(db,"messages",id)
);

}

/* AFFICHAGE TEMPS REEL */

const q = query(
collection(db,"messages"),
orderBy("date")
);

onSnapshot(q,(snapshot)=>{

chat.innerHTML = "";

snapshot.forEach((messageDoc)=>{

const data =
messageDoc.data();

const div =
document.createElement("div");

div.className = "message";

const heure =
new Date(data.date)
.toLocaleTimeString();

let imageHTML = "";

if(data.image){

imageHTML =
`<img src="${data.image}">`;

}

div.innerHTML = `

<div class="avatar">
${data.pseudo[0].toUpperCase()}
</div>

<div class="content">

<div class="delete"
onclick="supprimer('${messageDoc.id}')">
🗑️
</div>

<div class="username">

${data.pseudo}

<span class="time">
${heure}
</span>

</div>

<div>
${data.message}
</div>

${imageHTML}

</div>

`;

chat.appendChild(div);

});

chat.scrollTop =
chat.scrollHeight;

});

</script>

</body>
</html>
